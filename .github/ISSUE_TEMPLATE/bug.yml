name: 🐛 Bug Report
description: Report a reproducible issue or unexpected behavior
title: "[Bug]: "
labels: [bug]

body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Please fill out the following details to help us reproduce and fix the issue.
        This repository is public. Write in English, and do not include anything from `.keyturn/local/`.
        Agents only start work on issues opened by the maintainer or labeled `approved`.
        To report a security vulnerability, do not open an issue. Use a private GitHub Security Advisory instead.

  - type: input
    id: version
    attributes:
      label: Version
      description: What version (or commit) of keyturn are you using?
      placeholder: "e.g. v0.1.0 or abc1234"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: The AI tool and its version, the model, and the OS.
      placeholder: "e.g. Claude Code 2.1.x, Claude Sonnet, macOS 15"
    validations:
      required: true

  - type: input
    id: role
    attributes:
      label: Role or Skill
      description: Which role, skill, or gate was involved?
      placeholder: "e.g. qa, gate.sh, localize"

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How severe is this bug?
      options:
        - "Critical — App crashes or data loss"
        - "Major — Feature broken, no workaround"
        - "Minor — Feature broken, workaround exists"
        - "Cosmetic — Visual or minor issue"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce the issue?
      placeholder: |
        1. Clone the repository
        2. Run the application with expected input
        3. Observe the issue
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: Describe what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
      placeholder: Describe what actually happened instead.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Error Output
      description: Paste any relevant logs, error messages, or screenshots.
      placeholder: |
        ```
        error: unexpected behavior
        ```
      render: shell

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues to avoid duplicates.
        - label: I have provided sufficient steps to reproduce the issue.
