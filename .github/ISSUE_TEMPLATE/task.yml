name: ✅ Task
description: Propose or track a specific task or action item
title: "[Task]: "
labels: [task]

body:
  - type: markdown
    attributes:
      value: |
        Use this template to propose a clear, actionable task.
        This repository is public. Write in English, and do not include anything from `.keyturn/local/`.
        Agents only start work on issues opened by the maintainer or labeled `approved`.

  - type: input
    id: summary
    attributes:
      label: Task Summary
      description: What needs to be done?
      placeholder: e.g., Add CI workflow for linting
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Task Details
      description: Describe the task in more detail if needed.
      placeholder: |
        Set up a CI pipeline that checks code style and quality automatically.

  - type: input
    id: phase
    attributes:
      label: Phase
      description: Which phase in `docs/DESIGN.md` does this belong to? Also set the matching milestone.
      placeholder: e.g., Phase 1 - Foundation
    validations:
      required: true

  - type: textarea
    id: completion
    attributes:
      label: Completion Criteria
      description: How do we know this task is done? Write criteria that can be checked.
      placeholder: |
        - [ ] `localize` translates `docs/DESIGN.md` into Japanese under `.keyturn/i18n/ja/`
        - [ ] Nothing under `.keyturn/` is committed
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: Related Design and ADRs
      description: Sections of `docs/DESIGN.md` and ADRs this task follows.
      placeholder: e.g., DESIGN.md "Local translations", ADR-0003

  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of Scope
      description: What this task intentionally does not cover.

  - type: textarea
    id: subtasks
    attributes:
      label: Subtasks (optional)
      description: If there are multiple steps, list them as a markdown checklist.
      placeholder: |
        - [ ] Add unit tests
        - [ ] Update CI configuration
        - [ ] Review and update documentation

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies or Prerequisites
      description: Are there any related issues or tasks that must be done first?
      placeholder: e.g., Depends on #42

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have confirmed this task is not already tracked elsewhere.
        - label: This task has a clear outcome or completion criteria.
        - label: This task does not contradict an accepted ADR (or it proposes superseding one).
