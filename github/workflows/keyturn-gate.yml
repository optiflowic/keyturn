# keyturn's gate and merge conditions, run on a task's pull request (ADR 0043 and ADR 0046 in keyturn's docs/adr/).
#
# A person copies this file into the project once, as .github/workflows/keyturn-gate.yml. GitHub runs it as the pull
# request's branch has it; what keeps it unchanged is the agents' token, which has no Workflows permission, so GitHub
# refuses their pushes that change it (ADR 0042). Before committing it:
#   - set KEYTURN_COMMIT to the full SHA of the keyturn commit whose gate and profiles check the project;
#   - keep the tool steps of the profiles in the project's keyturn/config.json ("parts"), and remove the others;
#   - for a go part, set go-version-file to that part's go.mod;
#   - for a react-spa part, set node-version to the Node.js version in the design's "Stack" (keyturn/internal/design.md).
# On a plan with branch protection, then make the checks "keyturn gate" and "keyturn conditions" required on the default
# branch, with GitHub Actions as their expected source (github/README.md). "keyturn conditions" fails until the client's
# acceptance is recorded.
#
# Neither job has a job-level condition, since GitHub counts a skipped required check as passed (ADR 0043, ADR 0051). On a
# draft pull request, both jobs take another name, "keyturn gate (draft, not checked)" and "keyturn conditions (draft,
# not checked)", and fail in their first step: a task's pull request is a draft until the deliver step commits the
# delivery documents and marks it ready, deliver runs the gate locally on every round before that, and the merge
# conditions need the checks only on the head that is merged. So a draft never gets a check with a required check's
# name, and nobody reads its checks as passed. Marking it ready runs both checks on that head under their own names.

name: keyturn gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: keyturn-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # A full commit SHA, never a branch or a tag, so that the checks cannot change under the project.
  KEYTURN_COMMIT: 0000000000000000000000000000000000000000

jobs:
  gate:
    # No job-level condition (a skipped required check counts as passed on GitHub): a draft fails in the first step,
    # under another name, and a pull request from a branch that is not a task's, or to another branch than the default
    # one, fails in the second, before any checkout or tool. The conditions job has the same first two steps.
    name: ${{ github.event.pull_request.draft && 'keyturn gate (draft, not checked)' || 'keyturn gate' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Refuse a draft
        if: github.event.pull_request.draft
        run: |
          echo "a draft pull request: not checked; both checks run when it is marked ready" >&2
          exit 1

      - name: Check that it is a task's pull request
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          case "$HEAD_REF" in
            task/*) ;;
            *) echo "not a task branch (task/<task>): $HEAD_REF" >&2; exit 1 ;;
          esac
          if [ "$BASE_REF" != "$DEFAULT_BRANCH" ]; then
            echo "a task's pull request goes to the default branch ($DEFAULT_BRANCH), not to $BASE_REF" >&2
            exit 1
          fi

      - name: Check out the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check out keyturn
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: optiflowic/keyturn
          ref: ${{ env.KEYTURN_COMMIT }}
          path: .keyturn-ci
          persist-credentials: false

      # For a part with the go profile: Go from the part's go.mod, and golangci-lint v2.
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: api/go.mod
          cache: false
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0

      # For a part with the react-spa profile: the Node.js version the design's "Stack" names (ADR 0054).
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1

      - name: Run the gate
        env:
          HEAD_REF: ${{ github.head_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          .keyturn-ci/gates/gate.sh --task "${HEAD_REF#task/}" --default-branch "origin/$DEFAULT_BRANCH"

  conditions:
    # The merge conditions (ADR 0046): no open high or medium finding, and the client's acceptance of the documents at
    # the head. Committed records only: it runs no project code, so it needs no stack tools.
    name: ${{ github.event.pull_request.draft && 'keyturn conditions (draft, not checked)' || 'keyturn conditions' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Refuse a draft
        if: github.event.pull_request.draft
        run: |
          echo "a draft pull request: not checked; both checks run when it is marked ready" >&2
          exit 1

      - name: Check that it is a task's pull request
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          case "$HEAD_REF" in
            task/*) ;;
            *) echo "not a task branch (task/<task>): $HEAD_REF" >&2; exit 1 ;;
          esac
          if [ "$BASE_REF" != "$DEFAULT_BRANCH" ]; then
            echo "a task's pull request goes to the default branch ($DEFAULT_BRANCH), not to $BASE_REF" >&2
            exit 1
          fi

      - name: Check out the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check out keyturn
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: optiflowic/keyturn
          ref: ${{ env.KEYTURN_COMMIT }}
          path: .keyturn-ci
          persist-credentials: false

      - name: Check the merge conditions
        env:
          HEAD_REF: ${{ github.head_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          .keyturn-ci/gates/conditions.sh --task "${HEAD_REF#task/}" --default-branch "origin/$DEFAULT_BRANCH"
